let animationId=0,animating=false,graphPhase=0,lastWavePosition=0,spectrumFinished=false;
function drawGraph(canvas,type,v,elapsed=0,live=false){
 if(!canvas||!type)return;
 const r=canvas.getBoundingClientRect();if(r.width<1||r.height<1)return;
 const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);
 if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}
 const c=canvas.getContext('2d');if(!c)return;
 c.setTransform(dpr,0,0,dpr,0,0);
 const w=r.width,h=r.height,margin=4;c.clearRect(0,0,w,h);
 const model=stringModel(v),parts=model.partial,phase=live?elapsed:0;
 const baseline=(type==='envelope'||type==='spectrum'||type==='partials')?h-margin:h/2;
 if(type!=='wave'){c.strokeStyle='#d4d4d0';c.lineWidth=.7;c.beginPath();c.moveTo(0,baseline);c.lineTo(w,baseline);c.stroke();}
 if(type==='envelope'){
   // Full-note RMS envelope stays visible at rest and during playback.
   // Playback only adds a position indicator; it never crops the curve.
   const left=24,right=9,top=6,bottom=18;
   const pw=Math.max(1,w-left-right),ph=Math.max(1,h-top-bottom);
   const duration=lastWave?.duration||Math.min(8,Math.max(3.5,2+v.decay/900+v.release/750+v.reverb/90));
   const rms=lastWave?.rms;
   const envelopeAt=t=>{
     if(rms?.length){const f=clamp(t,0,1)*(rms.length-1),a=Math.floor(f),b=Math.min(rms.length-1,a+1);return rms[a]*(1-(f-a))+rms[b]*(f-a)}
     const sec=t*duration;
     return (1-Math.exp(-sec/Math.max(.002,v.attack/1000)))*Math.exp(-sec/(.65+v.decay/1000))*Math.pow(Math.max(0,1-t),2);
   };
   let peak=0;
   if(rms?.length){for(let i=0;i<rms.length;i++)peak=Math.max(peak,rms[i])}
   else{for(let i=0;i<=200;i++)peak=Math.max(peak,envelopeAt(i/200))}
   peak=Math.max(peak,1e-8);
   c.strokeStyle='#e0dfda';c.lineWidth=.7;
   for(let j=0;j<=2;j++){const y=top+ph*j/2;c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke()}
   c.beginPath();c.moveTo(left,top);c.lineTo(left,h-bottom);c.stroke();
   c.fillStyle='#777';c.font='9px Arial,sans-serif';c.textBaseline='alphabetic';
   c.textAlign='right';c.fillText('1',left-5,top+3);c.fillText('0',left-5,h-bottom+3);
   for(let j=0;j<=2;j++){const x=left+pw*j/2;c.textAlign='center';c.fillText((duration*j/2).toFixed(1),x,h-4)}
   c.strokeStyle='#222';c.lineWidth=1.5;c.lineJoin='round';c.beginPath();
   const visibleWidth=live?Math.max(0,Math.min(Math.ceil(pw),Math.floor(pw*phase/duration))):Math.ceil(pw);
   for(let i=0;i<=visibleWidth;i++){
     const t=i/pw, y=h-bottom-clamp(envelopeAt(t)/peak,0,1)*ph;
     if(i===0)c.moveTo(left,y);else c.lineTo(left+i,y)
   }
   c.stroke();
   return;
 }
 if(type==='partials'){
   // Modal amplitude decay: full reference curves and a moving time marker.
   const left=34,right=10,top=19,bottom=24;
   const pw=Math.max(1,w-left-right),ph=Math.max(1,h-top-bottom);
   const duration=lastWave?.duration||Math.min(8,Math.max(3.5,2+v.decay/900+v.release/750+v.reverb/90));
   const chosen=parts.slice(0,3),peak=Math.max(.00001,...chosen.map(p=>p.a));
   const colors=['#202020','#777','#aaa'];
   c.strokeStyle='#d8d8d4';c.lineWidth=.7;
   for(let j=0;j<=2;j++){const y=top+ph*j/2;c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke()}
   c.beginPath();c.moveTo(left,top);c.lineTo(left,h-bottom);c.stroke();
   c.font='9px Arial, sans-serif';c.fillStyle='#777';c.textBaseline='alphabetic';
   c.textAlign='right';c.fillText('1.0',left-4,top+3);c.fillText('0',left-4,h-bottom+3);
   for(let j=0;j<=4;j++){const x=left+pw*j/4;c.textAlign='center';c.fillText((duration*j/4).toFixed(1),x,h-7)}
   c.textAlign='right';c.fillText('秒',w-right,h-7);
   const current=clamp(phase,0,duration);
   chosen.forEach((p,k)=>{
     const ampAt=sec=>p.a/peak*Math.exp(-sec/Math.max(.08,p.tau));
     c.strokeStyle=colors[k];c.lineWidth=1.5;c.beginPath();
     for(let j=0;j<=Math.ceil(pw);j++){
       const sec=duration*j/pw, x=left+j, y=h-bottom-ampAt(sec)*ph;
       if(j===0)c.moveTo(x,y);else c.lineTo(x,y);
     }
     c.stroke();
     if(live){const x=left+pw*current/duration,y=h-bottom-ampAt(current)*ph;
       c.beginPath();c.arc(x,y,2.8,0,Math.PI*2);c.fillStyle=colors[k];c.fill()}
     c.fillStyle=colors[k];c.textAlign='left';c.fillText((k+1)+'倍音',left+k*pw/3,12);
   });
   if(live){const x=left+pw*current/duration;c.strokeStyle='#999';c.lineWidth=.8;c.setLineDash([2,3]);c.beginPath();c.moveTo(x,top);c.lineTo(x,h-bottom);c.stroke();c.setLineDash([])}
   return;
 }
 if(type==='spectrum'){
   // Each vertical line represents a modeled partial at its actual frequency.
   const count=Math.min(parts.length,32),maxHz=Math.max(2000,Math.ceil(parts[count-1].f/1000)*1000);
   const left=9,right=8,top=5,bottom=19,plotW=w-left-right,plotH=h-top-bottom;
   c.strokeStyle='#d4d4d0';c.lineWidth=.65;c.beginPath();c.moveTo(left,h-bottom);c.lineTo(w-right,h-bottom);c.stroke();
   c.fillStyle='#777';c.font='9px sans-serif';c.textBaseline='bottom';
   for(let hz=0;hz<=maxHz;hz+=1000){
     const x=left+hz/maxHz*plotW;
     c.strokeStyle='#e1e1dd';c.beginPath();c.moveTo(x,top);c.lineTo(x,h-bottom);c.stroke();
     c.textAlign=hz===0?'left':hz===maxHz?'right':'center';
     c.fillText(hz===0?'0':hz/1000+'k',x,h-3);
   }
   c.textAlign='right';c.fillText('Hz',w-right,h-3);
   // Static preview shows the modeled initial spectrum. During playback,
   // scale the modeled partials with the rendered note amplitude.
   const rms=lastWave?.rms;
   let measuredGain=1;
   if(live && rms?.length){
     const pos=Math.max(0,Math.min(rms.length-1,phase/Math.max(.001,lastWave.duration)*(rms.length-1)));
     const i=Math.floor(pos),f=pos-i;
     const now=rms[i]*(1-f)+rms[Math.min(i+1,rms.length-1)]*f;
     const peak=Math.max(.00001,...rms);
     measuredGain=now/peak;
   }
   const amps=parts.slice(0,count).map(p=>p.a*(live?Math.exp(-phase/Math.max(.09,p.tau)):1)*measuredGain);
   const reference=Math.max(.00001,...parts.map(p=>p.a));
   c.strokeStyle='#222';c.lineWidth=Math.max(1.4,Math.min(3,plotW/count*.55));c.beginPath();
   for(let k=0;k<count;k++){
     const x=left+Math.min(1,parts[k].f/maxHz)*plotW;
     const db=20*Math.log10(Math.max(1e-7,amps[k]/reference));
     const height=measuredGain<=0.00001?0:Math.max(0,(1+db/75))*plotH;
     c.moveTo(x,h-bottom);c.lineTo(x,h-bottom-height);
   }
   c.stroke();return;
 }
 if(type==='wave'){
   // Whole-note waveform overview: preserve the note's time span and its
   // measured amplitude envelope, but show a sparse oscillating trace rather
   // than a solid block of thousands of unresolved cycles.
   const left=25,right=12,top=9,bottom=21;
   const pw=Math.max(1,w-left-right),ph=Math.max(1,h-top-bottom),mid=top+ph/2;
   const duration=lastWave?.duration||Math.min(8,Math.max(3.5,2+v.decay/900+v.release/750+v.reverb/90));
   c.strokeStyle='#e5e5e1';c.lineWidth=.7;
   for(let j=0;j<=2;j++){const y=top+j*ph/2;c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke()}
   c.fillStyle='#777';c.font='9px Arial,sans-serif';c.textBaseline='alphabetic';
   // Label the existing middle gridline; do not draw a second zero line.
   c.textAlign='right';c.textBaseline='middle';c.fillText('0',left-7,mid);c.textBaseline='alphabetic';
   // During playback, display a moving 22 ms window of genuine PCM samples.
   // At rest retain the original full-duration overview without any changes.
   if(live && lastWave?.out?.length && lastWave.sr){
     const samples=lastWave.out,sr=lastWave.sr;
     const span=Math.min(samples.length,Math.max(2,Math.round(sr*.022)));
     const start=Math.max(0,Math.min(samples.length-span,Math.floor(Math.max(0,elapsed)*sr)));
     let peak=0;
     // Fixed gain across the note, so the apparent amplitude follows the real decay.
     // Use the global PCM peak instead of normalizing each moving window.
     for(let k=0;k<samples.length;k++)peak=Math.max(peak,Math.abs(samples[k]));
     peak=Math.max(peak,1e-8);
     c.save();c.beginPath();c.rect(left,top,pw,ph);c.clip();
     c.beginPath();
     const count=Math.max(2,Math.round(pw*2));
     for(let i=0;i<=count;i++){
       const pos=start+(i/count)*(span-1);
       const k=Math.floor(pos),f=pos-k;
       const sample=samples[k]*(1-f)+(samples[Math.min(samples.length-1,k+1)]||0)*f;
       const x=left+pw*i/count,y=mid-sample/peak*ph*.43;
       if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
     }
     c.strokeStyle='#292929';c.lineWidth=.85;c.lineJoin='round';c.stroke();c.restore();
     c.fillStyle='#777';c.font='9px Arial,sans-serif';
     for(let j=0;j<=4;j++){
       const x=left+pw*j/4;
       c.textAlign=j===0?'left':j===4?'right':'center';
       c.fillText((j*22/4).toFixed(1),x,h-5);
     }
     c.textAlign='right';c.fillText('ms',w-right,h-5);
     return;
   }
   for(let j=0;j<=4;j++){const x=left+pw*j/4;c.textAlign=j===0?'left':j===4?'right':'center';c.fillText((duration*j/4).toFixed(1),x,h-5)}
   c.textAlign='right';c.fillText('秒',w-right,h-5);
   // Static full-duration overview. Each vertex is an actual PCM sample,
   // selected as a local signed extremum. No artificial carrier or playback crop.
   const samples=lastWave?.out;
   if(samples?.length){
     const n=Math.max(32,Math.floor(pw/3));
     let peak=0;
     for(let i=0;i<samples.length;i++)peak=Math.max(peak,Math.abs(samples[i]));
     peak=Math.max(peak,1e-8);
     c.beginPath();
     for(let i=0;i<=n;i++){
       const lo=Math.min(samples.length-1,Math.floor(i/n*samples.length));
       const hi=Math.min(samples.length,Math.max(lo+1,Math.floor((i+1)/n*samples.length)));
       let best=samples[lo];
       const sign=i%2===0?1:-1;
       for(let k=lo+1;k<hi;k++){
         if(sign*samples[k]>sign*best)best=samples[k];
       }
       const x=left+pw*i/n,y=mid-best/peak*ph*.43;
       if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
     }
     c.strokeStyle='#292929';c.lineWidth=.85;c.lineJoin='round';c.stroke();
   }
   return;
 }
 if(type==='wave'||type==='string'){
   c.strokeStyle='#e4e4e0';c.lineWidth=.65;
   for(let j=1;j<=3;j++){const x=w*j/4;c.beginPath();c.moveTo(x,2);c.lineTo(x,h-2);c.stroke()}
 }
 c.strokeStyle='#222';c.lineWidth=1.3;c.lineJoin='round';c.beginPath();
 for(let i=0;i<=Math.floor(w);i++){
   const t=i/Math.max(w,1);let y=0;
   if(type==='wave'){
     if(lastWave?.out?.length){
       const samples=lastWave.out,sr=lastWave.sr;
       const windowSize=Math.min(samples.length,Math.round(sr*.022));
       // Follow the audio playback position instead of repeatedly drawing the first 22 ms.
       // At rest show a clear waveform near the note onset, not the almost-silent tail.
       const startSec=live?Math.max(0,Math.min(elapsed,lastWave.duration-.022)):.025;
       const startIndex=Math.max(0,Math.min(samples.length-windowSize,Math.floor(startSec*sr)));
       const index=Math.min(samples.length-1,startIndex+Math.floor(t*Math.max(1,windowSize-1)));
       const displayGain=live?1:1.35;
       y=samples[index]*h*.47*displayGain;
     }else{
       let sum=0;const subset=parts.slice(0,12);
       for(let k=0;k<subset.length;k++)sum+=subset[k].a*Math.sin(t*(k+1)*Math.PI*15);
       y=Math.tanh(sum*.85)*h*.46;
     }
   }else if(type==='envelope'){
     let env;
     if(lastWave?.rms?.length){const idx=Math.min(lastWave.rms.length-1,Math.floor(t*(lastWave.rms.length-1)));env=lastWave.rms[idx];}
     else {const sec=t*(Math.min(8,Math.max(3.5,2+v.decay/900+v.release/750+v.reverb/90)));env=(1-Math.exp(-sec/Math.max(.002,v.attack/1000)))*Math.exp(-sec/(.65+v.decay/1000))*Math.pow(1-t,2);}
     // Normalize a complete decay trace so its peak uses the plot height.
     let peak=1;
     if(lastWave?.rms?.length)peak=Math.max(.00001,...lastWave.rms);
     y=Math.min(1,env/peak)*(h-9);
     const yy=h-margin-y;if(i===0)c.moveTo(i,yy);else c.lineTo(i,yy);continue;
   }else if(type==='string'){
     // Physical fixed-end standing waves: each mode has spatial shape sin(n*pi*x),
     // its own modal frequency and exponential decay. The string ends stay fixed.
     // Display a reference snapshot when stopped, rather than falsely animating.
     const modes=parts.slice(0,Math.min(8,parts.length));
     const denom=Math.max(.001,modes.reduce((acc,p)=>acc+Math.abs(p.a),0));
     const seconds=live?phase:.0004;
     let displacement=0;
     for(let k=0;k<modes.length;k++){
       const p=modes[k];
       const modalEnvelope=live?Math.exp(-seconds/Math.max(.08,p.tau)):1;
       displacement+=p.a*modalEnvelope*Math.sin((k+1)*Math.PI*t)*Math.cos(2*Math.PI*p.f*seconds);
     }
     y=displacement/denom*h*.87;

   }
   const yy=h/2-y;if(i===0)c.moveTo(i,yy);else c.lineTo(i,yy);
 }
 c.stroke();
 if(type==='envelope'&&live){const x=Math.min(w-1,(phase/(lastWave?.duration||3.4))*w);c.strokeStyle='#888';c.lineWidth=1;c.beginPath();c.moveTo(x,3);c.lineTo(x,h-3);c.stroke()}
}
function renderGraphs(elapsed=0,live=false){
 // The preview is computed from the same synthesis function as playback.
 // It must exist before the first note, not only after pressing Play.
 if(!lastWave && graphs.includes('wave'))lastWave=createWave(vals);
 for(let i=0;i<3;i++)drawGraph($('graph'+i),graphs[i],vals,elapsed,live);
}
function animateGraphs(){if(!animating)return;const elapsed=Math.max(0,(performance.now()-playStart)/1000);lastWavePosition=Math.max(0,Math.min(elapsed,(lastWave?.duration||3.4)-.022));renderGraphs(elapsed,true);if(elapsed<(lastWave?.duration||3.4)&&voices.length){animationId=requestAnimationFrame(animateGraphs)}else{animating=false;spectrumFinished=true;renderGraphs()}}
function startGraphAnimation(){cancelAnimationFrame(animationId);animating=true;animationId=requestAnimationFrame(animateGraphs)}
window.addEventListener('resize',()=>renderGraphs());
tabs();renderParams();renderSlots();$('graph0').parentElement.classList.add('ready');requestAnimationFrame(()=>renderGraphs());window.addEventListener('load',()=>setTimeout(renderGraphs,100));
